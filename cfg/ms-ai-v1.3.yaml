# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: /root/workspace/MS-Labeler/dataset  # dataset root dir
train: 
- train.txt  # train images (relative to 'path') 128 images
val: 
- val.txt # val images (relative to 'path') 128 images
test:  # test images (optional)

# Classes
names:
  0: person
  1: car
  2: truck
  3: bus
  4: bicycle
  5: motorcycle
  6: dog
  7: cat
  8: bird
  9: fire
  



